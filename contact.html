<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | FAIZAN AHMAD COMPANY</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <style>
        .contact-container { padding: 50px 20px; max-width: 600px; margin: 0 auto; }
        .contact-card { background: #1e293b; padding: 30px; border-radius: 8px; border: 1px solid #334155; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #cbd5e1; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="logo">FAIZAN AHMAD COMPANY</div>
        <nav>
            <a href="../index.html">Home</a>
            <a href="about.html">About System</a>
        </nav>
    </header>

    <div class="contact-container">
        <div class="contact-card">
            <h2 style="color: #38bdf8; margin-bottom: 20px;">Get In Touch</h2>
            <form action="#">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" placeholder="Enter full name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter email address">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="4" placeholder="How can we assist your agency?"></textarea>
                </div>
                <button type="button" class="btn primary" style="width: 100%; cursor: pointer;">Send Inquiry</button>
            </form>
            
            <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #334155; font-size: 0.9rem; color: #94a3b8;">
                <p>Direct Developer Line: <strong>03489573662</strong></p>
                <p>Email: <strong>faizanaahmad091@gmail.com</strong></p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; FAIZAN AHMAD COMPANY. Architected by <strong>Faizan Ahmad</strong></p>
    </footer>

</body>
</html>
